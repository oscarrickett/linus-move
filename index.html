<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1421" />
  <title>Linus till Sverige</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-flag" aria-hidden="true"></div>
        <div class="brand-text">Linus till Sverige</div>
      </div>

      <input class="side-search" id="side-search" type="search" placeholder="Filter phases..." />

      <nav class="side-nav" id="side-nav-primary">
        <a class="side-item" href="#/">
          <span class="side-glyph">H</span><span>Home</span>
        </a>
        <a class="side-item" href="#/board">
          <span class="side-glyph">A</span><span>All tasks</span>
          <span class="side-count" id="count-all">0</span>
        </a>
        <a class="side-item" href="#/vault">
          <span class="side-glyph">V</span><span>Vault</span>
        </a>
      </nav>

      <div class="side-label">Phases</div>
      <nav class="side-nav" id="side-nav-phases"></nav>

      <div class="side-footer" id="side-footer">
        <span id="user-chip" class="user-chip"></span>
        <button class="linky" id="signout-btn" hidden>Sign out</button>
      </div>
    </aside>

    <main class="main" id="main"></main>

    <nav class="bottom-nav" id="bottom-nav">
      <a href="#/" data-nav="home">Home</a>
      <a href="#/board" data-nav="board">Board</a>
      <a href="#/vault" data-nav="vault">Vault</a>
    </nav>
  </div>

  <div id="drawer-root"></div>
  <div id="toast-root" class="toast-root"></div>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
